name: smoke

on:
  push:
  pull_request:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.4.1
        run: |
          curl -L --fail -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Run first-slice smoke test
        env:
          GODOT: /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
        run: ./tools/run_smoke.sh
